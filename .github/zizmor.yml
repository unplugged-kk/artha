# zizmor configuration. See https://docs.zizmor.sh/configuration/
#
# A NOTE ON THE POINTERS BELOW. Each `ignore` entry names a `file:line:col`, so
# every one of them is a promise about a line number in a file this repository
# keeps editing. Adding or removing a line above one of these findings silently
# detaches its suppression: the scan is not failed by a finding (ci.yml runs
# zizmor with `|| true`), so the only symptom is the finding reappearing in the
# Security tab -- or, worse, an unrelated line inheriting a suppression written
# for another. When ci.yml moves, re-derive these against the new file rather
# than trusting the numbers.

rules:
  cache-poisoning:
    # The build-and-push job in ci.yml uses actions/setup-node WITHOUT a `cache:`
    # input, so setup-node does NOT enable npm caching. Zizmor's audit flags it
    # because the same job also publishes container images via
    # docker/build-push-action (which uses its own type=gha buildx cache - that
    # caching is intentional for build speed). This is a low-confidence false
    # positive in our setup; revisit if we ever add `cache: 'npm'` here. The
    # build-preview job (the PR + main preview publish) follows the exact same
    # pattern -- setup-node without npm caching, plus a docker/build-push-action
    # type=gha buildx cache -- so it carries the same documented suppression.
    ignore:
      - ci.yml:504:9
      - ci.yml:890:9

  artipacked:
    # The release job intentionally keeps the GITHUB_TOKEN persisted on the
    # checkout so the subsequent "Commit version bump" step can `git push` the
    # version bump and `gh release create` the tag. Every other checkout in this
    # repo sets persist-credentials: false.
    ignore:
      - ci.yml:667:9
